name: Build mod

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.10.2

      - name: Build
        run: gradle build --no-daemon --stacktrace

      - name: Check jar contents
        run: |
          ls -la build/libs
          unzip -l build/libs/morpheverything-*.jar | grep -E "mods.toml|MorphEverything.class"

      - name: Upload jar
        uses: actions/upload-artifact@v4
        with:
          name: morpheverything-jar
          path: build/libs/*.jar
